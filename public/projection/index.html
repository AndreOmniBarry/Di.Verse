<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
  <title>Di.Verse</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #000;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      font-family: Arial, sans-serif;
    }

    /* IDLE / LOGO STATE */
    #idle {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0A0A1E;
    }
    #idle .logo {
      font-size: 3rem;
      font-weight: bold;
      color: rgba(255,255,255,0.06);
      letter-spacing: 10px;
      text-transform: uppercase;
    }

    /* LOWER-THIRD */
   #lowerThird {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      min-height: 35vh;
      background: rgba(8, 8, 25, 0.92);
      border-top: 3px solid #E94560;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 24px 64px;
      opacity: 0;
      transform: translateY(10px);
      transition: opacity 0.35s ease, transform 0.35s ease;
      pointer-events: none;
      z-index: 10;
    }
    #lowerThird.show {
      opacity: 1;
      transform: translateY(0);
    }

    .lt-ref {
      font-size: 1.2rem;
      font-weight: bold;
      color: #F5C518;
      letter-spacing: 2px;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .badge {
      background: #E94560;
      color: white;
      font-size: 0.7rem;
      font-weight: bold;
      padding: 3px 10px;
      border-radius: 20px;
      letter-spacing: 1px;
    }
    .lt-text {
      font-size: 1.9rem;
      color: #FFFFFF;
      line-height: 1.55;
      font-weight: bold;
    }
    .lt-text.md { font-size: 1.55rem; }
    .lt-text.sm { font-size: 1.25rem; }

    /* FULL SCREEN */
    #fullScreen {
      position: fixed;
      inset: 0;
      background: #1A1A2E;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 60px;
      text-align: center;
      opacity: 0;
      transition: opacity 0.35s ease;
      pointer-events: none;
      z-index: 10;
    }
    #fullScreen.show { opacity: 1; }

    .fs-text {
      font-size: 2.2rem;
      font-weight: bold;
      color: #FFFFFF;
      line-height: 1.55;
      max-width: 80%;
      margin-bottom: 28px;
    }
    .fs-text.md { font-size: 1.8rem; }
    .fs-text.sm { font-size: 1.4rem; }

    .fs-ref {
      font-size: 1.1rem;
      color: #E94560;
      font-weight: bold;
      letter-spacing: 1px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    /* RECONNECT NOTICE */
    #reconnect {
      position: fixed;
      bottom: 12px;
      right: 16px;
      font-size: 0.65rem;
      color: rgba(255,255,255,0.25);
      display: none;
      z-index: 20;
    }
  </style>
</head>
<body>

  <div id="idle">
    <div class="logo">Di.Verse</div>
  </div>

  <div id="lowerThird">
    <div class="lt-ref">
      <span id="ltRef"></span>
      <span class="badge" id="ltBadge">KJV</span>
    </div>
    <div class="lt-text" id="ltText"></div>
  </div>

  <div id="fullScreen">
    <div class="fs-text" id="fsText"></div>
    <div class="fs-ref">
      <span id="fsRef"></span>
      <span class="badge" id="fsBadge">KJV</span>
    </div>
  </div>

  <div id="reconnect">Reconnecting...</div>

<script>
  let reconnectTimer;

  function sizeClass(text) {
    if (text.length > 200) return 'sm';
    if (text.length > 120) return 'md';
    return '';
  }

  function showVerse(verse) {
    hide();
    const sc = sizeClass(verse.text);

    if (verse.displayMode === 'full-screen') {
      document.getElementById('fsText').textContent = verse.text;
      document.getElementById('fsText').className = `fs-text ${sc}`;
      document.getElementById('fsRef').textContent = verse.reference;
      document.getElementById('fsBadge').textContent = verse.translation;
      document.getElementById('fullScreen').classList.add('show');
    } else {
      document.getElementById('ltText').textContent = verse.text;
      document.getElementById('ltText').className = `lt-text ${sc}`;
      document.getElementById('ltRef').textContent = verse.reference;
      document.getElementById('ltBadge').textContent = verse.translation;
      document.getElementById('lowerThird').classList.add('show');
    }
  }

  function showLyrics(lyrics) {
    hide();
    const label = `${lyrics.songTitle}  ·  ${lyrics.section || ''}`;
    const badge = `${lyrics.slideNum}/${lyrics.totalSlides}`;

    if (lyrics.displayMode === 'full-screen') {
      document.getElementById('fsText').textContent = lyrics.content;
      document.getElementById('fsText').className = `fs-text ${sizeClass(lyrics.content)}`;
      document.getElementById('fsRef').textContent = label;
      document.getElementById('fsBadge').textContent = badge;
      document.getElementById('fullScreen').classList.add('show');
    } else {
      document.getElementById('ltText').textContent = lyrics.content;
      document.getElementById('ltText').className = `lt-text ${sizeClass(lyrics.content)}`;
      document.getElementById('ltRef').textContent = label;
      document.getElementById('ltBadge').textContent = badge;
      document.getElementById('lowerThird').classList.add('show');
    }
  }

  function hide() {
    document.getElementById('lowerThird').classList.remove('show');
    document.getElementById('fullScreen').classList.remove('show');
  }

  function connect() {
    const ws = new WebSocket(`ws://${location.host}?type=projection`);

    ws.onopen = () => {
      clearTimeout(reconnectTimer);
      document.getElementById('reconnect').style.display = 'none';
    };

    ws.onmessage = (e) => {
      const msg = JSON.parse(e.data);
      if (msg.action === 'SHOW_VERSE') showVerse(msg.verse);
      else if (msg.action === 'SHOW_LYRICS') showLyrics(msg.lyrics);
      else if (msg.action === 'CLEAR') hide();
    };

    ws.onclose = () => {
      document.getElementById('reconnect').style.display = 'block';
      reconnectTimer = setTimeout(connect, 2000);
    };

    ws.onerror = () => ws.close();
  }

  connect();
</script>
</body>
</html>
