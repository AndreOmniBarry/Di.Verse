<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
  <title>Di.Verse</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #000; width: 100vw; height: 100vh; overflow: hidden; font-family: Arial, sans-serif; }
    #idle { position: absolute; top: 0; right: 0; bottom: 0; left: 0; display: flex; align-items: center; justify-content: center; background: #0A0A1E; }
    #idle .logo { font-size: 3rem; font-weight: bold; color: rgba(255,255,255,0.06); letter-spacing: 10px; text-transform: uppercase; }
    /* Livestream overlay (/projection?overlay=1): transparent page, so OBS /
       vMix show only the verse box on top of the camera */
    html.overlay, html.overlay body { background: transparent; }
    html.overlay #idle, html.overlay #reconnect { display: none !important; }
    body { font-family: "Segoe UI", -apple-system, "Helvetica Neue", Arial, sans-serif; }
    #lowerThird {
      position: fixed; bottom: 0; left: 0; width: 100%;
      background: rgba(8,8,25,0.92); border-top: 3px solid #E94560;
      display: flex; flex-direction: column; justify-content: center;
      padding: 2.4vh 4.5vw 2.8vh; opacity: 0; transform: translateY(8px);
      transition: opacity 0.3s ease, transform 0.3s ease;
      pointer-events: none; z-index: 10; max-height: 62vh; overflow: hidden;
    }
    #lowerThird.show { opacity: 1; transform: translateY(0); }
    /* Sizes are set from script in vh (share of screen height) — see SIZES */
    .lt-ref { font-weight: 800; color: #F5C518; letter-spacing: 0.06em; margin-bottom: 0.9vh; display: flex; align-items: center; text-shadow: 0 1px 3px rgba(0,0,0,0.6); }
    .lt-ref .badge, .fs-ref .badge, .sq-ref .badge { margin-left: 0.6em; }
    .badge:empty { display: none; }
    .badge { background: #E94560; color: white; font-size: 0.62em; font-weight: 800; padding: 0.25em 0.75em; border-radius: 1em; letter-spacing: 0.08em; }
    .page-count { margin-left: auto; font-size: 0.7em; font-weight: 700; color: rgba(255,255,255,0.75); letter-spacing: 0.1em; }
    .lt-text, .fs-text { white-space: pre-line; transition: opacity 0.26s ease; }
    .lt-text { color: #FFFFFF; line-height: 1.32; font-weight: 700; }
    .lt-text.turning, .fs-text.turning { opacity: 0; }
    #fullScreen {
      position: fixed; top: 0; right: 0; bottom: 0; left: 0; background: #1A1A2E; display: flex; flex-direction: column;
      align-items: center; justify-content: center; padding: 60px; text-align: center;
      opacity: 0; transition: opacity 0.3s ease; pointer-events: none; z-index: 10;
    }
    #fullScreen.show { opacity: 1; }
    .fs-text { font-weight: 700; color: #FFFFFF; line-height: 1.35; width: 86%; margin-bottom: 3vh; } /* fixed width: pages are measured against it */
    .fs-ref { width: 86%; color: #E94560; font-weight: bold; letter-spacing: 1px; display: flex; align-items: center; justify-content: center; }
    .fs-ref .page-count { margin-left: 1em; }
    /* Live/still backgrounds (backgrounds.js) sit under a soft darkening layer */
    .bg-canvas, .bg-dim { position: absolute; top: 0; right: 0; bottom: 0; left: 0; width: 100%; height: 100%; display: none; pointer-events: none; }
    .bg-canvas { z-index: 0; }
    .bg-dim { z-index: 1; background: linear-gradient(0deg, rgba(0,0,0,0.38), rgba(0,0,0,0.16)); }
    #lowerThird > .lt-ref, #lowerThird > .lt-text, #fullScreen > .fs-text, #fullScreen > .fs-ref { position: relative; z-index: 2; }
    /* Crisp edge + soft halo: readable over any camera picture */
    .lt-text, .fs-text { text-shadow: 0 2px 3px rgba(0,0,0,0.65), 0 0 18px rgba(0,0,0,0.35); }
    /* Caption styles */
    /* High-end glass caption: see-through tinted panel (the camera shows
       through in vMix/OBS), bright top edge, inner glow, accent light on the
       left. backdrop-filter adds real blur on the projector page. */
    html[data-frame="glass"] #lowerThird {
      left: 4vw; right: 4vw; bottom: 4.5vh; width: auto; overflow: hidden;
      padding: 2.4vh 3.6vw 2.8vh 4.4vw;
      border-radius: 2.6vh; border: 1px solid rgba(255,255,255,0.16); border-top-color: rgba(255,255,255,0.55);
      box-shadow: 0 2.2vh 6vh rgba(0,0,0,0.45), inset 0 1px 0 rgba(255,255,255,0.6),
                  inset 0 0 0 1px rgba(255,255,255,0.05), inset 0 -4vh 8vh rgba(140,190,255,0.07);
      -webkit-backdrop-filter: blur(22px) saturate(160%); backdrop-filter: blur(22px) saturate(160%);
    }
    html[data-frame="glass"] #lowerThird::after {
      content: ''; position: absolute; top: 0; right: 0; bottom: 0; left: 0; z-index: 1; pointer-events: none; border-radius: inherit;
      background: linear-gradient(180deg, rgba(255,255,255,0.22), rgba(255,255,255,0.06) 26%, transparent 52%),
                  radial-gradient(120% 90% at 0% 0%, rgba(255,255,255,0.10), transparent 55%);
    }
    html[data-frame="glass"] #lowerThird::before {
      content: ''; position: absolute; left: 1.6vw; top: 22%; bottom: 22%; width: 0.5vh; z-index: 2; border-radius: 1vh;
      background: linear-gradient(180deg, var(--accent, #E94560), rgba(255,255,255,0.85));
      box-shadow: 0 0 1.6vh var(--accent, #E94560);
    }
    html[data-frame="minimal"] #lowerThird { background: transparent !important; border-top: none; }
    html[data-frame="minimal"] .lt-text { text-shadow: 0 2px 6px rgba(0,0,0,0.9), 0 0 24px rgba(0,0,0,0.7); }
    /* Light backgrounds need dark text */
    html[data-light] .lt-text, html[data-light] .fs-text { color: #14142B !important; text-shadow: none; }
    html[data-light] #ltRef, html[data-light] #fsRef { color: #1F3A8A !important; }
    /* ── Squeeze-back (camera window + large scripture panel) ──
       Window: 46% of the screen, top-left, 16:9 — the scripture panel gets
       the rest. In vMix the camera layer is sized to fill it (SETUP.md). */
    #squeeze { position: fixed; top: 0; right: 0; bottom: 0; left: 0; opacity: 0; transition: opacity 0.45s ease; pointer-events: none; z-index: 11; }
    #squeeze.show { opacity: 1; }
    .sq-bg { position: absolute; top: 0; right: 0; bottom: 0; left: 0; background: #070a14; }
    .sq-window { position: absolute; left: 3vw; top: 5vh; width: calc(var(--cam, 0.25) * 100vw); height: calc(var(--cam, 0.25) * 100vh); z-index: 2; border-radius: 0.6vh;
      box-shadow: 0 0 0 0.35vh rgba(255,255,255,0.8), 0 0 0 0.9vh rgba(255,255,255,0.08), 0 1.5vh 5vh rgba(0,0,0,0.55); }
    .sq-panel { position: absolute; left: calc(3vw + var(--cam, 0.25) * 100vw + 3vw); right: 3vw; top: 5vh; bottom: 5vh; z-index: 3; overflow: hidden;
      display: flex; flex-direction: column; justify-content: center; padding: 3vh 2.2vw;
      border-radius: 2vh; background: linear-gradient(180deg, rgba(255,255,255,0.10), rgba(255,255,255,0.03));
      border: 1px solid rgba(255,255,255,0.14); border-top-color: rgba(255,255,255,0.45);
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.45), 0 2vh 5vh rgba(0,0,0,0.35); }
    .sq-panel::before { content: ''; position: absolute; left: 2.2vw; right: 2.2vw; top: 0; height: 0.45vh; border-radius: 0 0 1vh 1vh;
      background: linear-gradient(90deg, var(--accent, #E94560), rgba(255,255,255,0.8)); box-shadow: 0 0 1.6vh var(--accent, #E94560); }
    .sq-text { font-weight: 700; color: #FFFFFF; line-height: 1.3; text-align: center; white-space: pre-line; transition: opacity 0.26s ease;
      text-shadow: 0 2px 3px rgba(0,0,0,0.6), 0 0 18px rgba(0,0,0,0.3); }
    .sq-text.turning { opacity: 0; }
    .sq-page { display: none; margin-top: 2vh; font-size: 2.2vh; font-weight: 700; color: rgba(255,255,255,0.7); letter-spacing: 0.1em; min-height: 2.6vh; }
    .sq-ref { position: absolute; left: 3vw; width: calc(var(--cam, 0.25) * 100vw); top: calc(5vh + var(--cam, 0.25) * 100vh + 3vh); bottom: 5vh; flex-wrap: wrap; align-content: center; z-index: 3; display: flex; align-items: center;
      font-weight: 800; color: #F5C518; letter-spacing: 0.04em; text-shadow: 0 2px 4px rgba(0,0,0,0.6); }
    /* Small camera window (TV-friendly, up to a third of the screen): the
       reference sits beside the camera and the scripture runs the full width
       underneath in very large type */
    html[data-sq="stack"] .sq-ref { left: calc(3vw + var(--cam) * 100vw + 2.5vw); right: 3vw; width: auto; top: 5vh; bottom: auto; height: calc(var(--cam) * 100vh); }
    html[data-sq="stack"] .sq-panel { left: 3vw; right: 3vw; top: calc(5vh + var(--cam) * 100vh + 2.5vh); bottom: 4vh; justify-content: center; }
    /* On the plain projector page (no vMix behind it) say what the window is for */
    /* In vMix (overlay page) the background is four strips around the camera
       window instead of one clipped layer: plain boxes that any browser draws.
       background-attachment: fixed lines their backgrounds up as one picture. */
    .sq-strip { position: absolute; display: none; background: #070a14; background-attachment: fixed; }
    html.overlay .sq-strip { display: block; }
    html.overlay .sq-bg { display: none; }
    .sq-strip.t { left: 0; right: 0; top: 0; height: 5vh; }
    .sq-strip.b { left: 0; right: 0; top: calc(5vh + var(--cam, 0.25) * 100vh); bottom: 0; }
    .sq-strip.l { left: 0; width: 3vw; top: 5vh; height: calc(var(--cam, 0.25) * 100vh); }
    .sq-strip.r { left: calc(3vw + var(--cam, 0.25) * 100vw); right: 0; top: 5vh; height: calc(var(--cam, 0.25) * 100vh); }
    /* Live backgrounds in vMix: a slow CSS drift instead of WebGL (vMix's
       browser can draw WebGL as see-through, and it spares the vMix PC) */
    .bg-drift { background-size: 300% 100% !important; -webkit-animation: bgDrift 24s ease-in-out infinite alternate; animation: bgDrift 24s ease-in-out infinite alternate; }
    @-webkit-keyframes bgDrift { from { background-position: 0% 50%; } to { background-position: 100% 50%; } }
    @keyframes bgDrift { from { background-position: 0% 50%; } to { background-position: 100% 50%; } }
    html:not(.overlay) .sq-window::after { content: 'vMix camera'; position: absolute; top: 0; right: 0; bottom: 0; left: 0; display: flex; align-items: center; justify-content: center;
      color: rgba(255,255,255,0.25); font-size: 2vh; letter-spacing: 0.1em; text-transform: uppercase; }
    /* Reference only: a small lower third for note-takers ("Scriptural
       Reference — Genesis 22:1–19"), the camera stays full screen */
    #refNote { position: fixed; left: 4vw; bottom: 5vh; z-index: 12; opacity: 0; transform: translateY(1vh); transition: opacity 0.35s ease, transform 0.35s ease; pointer-events: none;
      padding: 1.6vh 3vw 1.8vh 2.6vw; border-radius: 1.8vh; background: rgba(10,12,28,0.78); border: 1px solid rgba(255,255,255,0.16); border-top-color: rgba(255,255,255,0.45);
      box-shadow: 0 1.5vh 4vh rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,255,255,0.35); max-width: 70vw; }
    #refNote.show { opacity: 1; transform: translateY(0); }
    #refNote .rn-label { font-size: 1.7vh; font-weight: 800; letter-spacing: 0.22em; text-transform: uppercase; color: var(--accent, #E94560); margin-bottom: 0.5vh; }
    #refNote .rn-ref { font-size: 4.6vh; font-weight: 700; font-style: italic; color: #FFFFFF; text-shadow: 0 2px 4px rgba(0,0,0,0.5); }
    #refNote .rn-title { font-size: 2.1vh; color: rgba(255,255,255,0.75); margin-top: 0.4vh; }
    #refNote .rn-title:empty { display: none; }
    #reconnect { position: fixed; bottom: 10px; right: 14px; font-size: 0.62rem; color: rgba(255,255,255,0.2); display: none; z-index: 20; }

    /* ── Virtual set (v1.12): presentation profiles ──
       Applied only once a profile is taken live (html[data-vs]); without one
       the page looks exactly as before. Every size is in vw / vh, so 1080p
       and 4K render identically. */
    html[data-vs] #lowerThird, html[data-vs] #fullScreen, html[data-vs] #squeeze, html[data-vs] #refNote, #noteLayer {
      transition-duration: var(--vs-ms, 0.45s);
    }
    html[data-vs-trans="none"] #lowerThird, html[data-vs-trans="none"] #fullScreen, html[data-vs-trans="none"] #squeeze, html[data-vs-trans="none"] #noteLayer { transition: none; }
    html[data-vs-trans="slide"] #lowerThird:not(.show) { transform: translateY(4vh); }
    html[data-vs-trans="slide"] #noteLayer:not(.show) { transform: translateY(-3vh); }
    html[data-vs-type="serif"] .lt-text, html[data-vs-type="serif"] .fs-text, html[data-vs-type="serif"] .sq-text, html[data-vs-type="serif"] #noteLayer .nl-text {
      font-family: "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif; font-weight: 600; letter-spacing: 0.005em;
    }
    html[data-vs-type="serif"] .lt-ref, html[data-vs-type="serif"] .fs-ref, html[data-vs-type="serif"] .sq-ref { letter-spacing: 0.12em; text-transform: uppercase; }
    /* palette (not for the "theme" background, which keeps the operator's Look settings) */
    html[data-vs-bg]:not([data-vs-bg="theme"]) #ltRef, html[data-vs-bg]:not([data-vs-bg="theme"]) #fsRef, html[data-vs-bg]:not([data-vs-bg="theme"]) #sqRef { color: var(--vs-accent) !important; }
    html[data-vs-bg]:not([data-vs-bg="theme"]) .lt-text, html[data-vs-bg]:not([data-vs-bg="theme"]) .fs-text, html[data-vs-bg]:not([data-vs-bg="theme"]) .sq-text { color: var(--vs-text) !important; }
    html[data-vs-bg]:not([data-vs-bg="theme"]) .badge { background: transparent; color: var(--vs-accent); border: 1px solid var(--vs-accent); }
    html[data-vs-bg]:not([data-vs-bg="theme"]) #lowerThird { border-top: 0.25vh solid var(--vs-accent); }
    html[data-vs-bg="navy-gradient"] #lowerThird, html[data-vs-bg="navy-gradient"] #fullScreen, html[data-vs-bg="navy-gradient"] .sq-bg {
      background: radial-gradient(120% 140% at 20% 0%, var(--vs-panel), var(--vs-base) 70%) !important; }
    html[data-vs-bg="graphite"] #lowerThird, html[data-vs-bg="graphite"] #fullScreen, html[data-vs-bg="graphite"] .sq-bg {
      background: linear-gradient(160deg, #23262D, #121418 75%) !important; }
    html[data-vs-bg="cinematic-dark"] #lowerThird, html[data-vs-bg="cinematic-dark"] #fullScreen, html[data-vs-bg="cinematic-dark"] .sq-bg {
      background: radial-gradient(90% 70% at 50% 45%, #141B2A, #05070C 80%) !important; }
    html[data-vs-bg="parchment"] #lowerThird, html[data-vs-bg="parchment"] #fullScreen, html[data-vs-bg="parchment"] .sq-bg {
      background: radial-gradient(120% 120% at 50% 30%, #F7F1E3, #E7DCC4 80%) !important; }
    html[data-vs-bg="parchment"] .lt-text, html[data-vs-bg="parchment"] .fs-text, html[data-vs-bg="parchment"] .sq-text { color: #1C2230 !important; text-shadow: none; }
    html[data-vs-bg="parchment"] #ltRef, html[data-vs-bg="parchment"] #fsRef, html[data-vs-bg="parchment"] #sqRef { color: #8A6A2B !important; }
    /* transparent: livestream graphics over the camera (any page, not only ?overlay=1) */
    html[data-vs-bg="transparent"], html[data-vs-bg="transparent"] body { background: transparent; }
    html[data-vs-bg="transparent"] #idle { display: none; }
    html[data-vs-bg="transparent"] #lowerThird { background: linear-gradient(90deg, rgba(11,20,36,0.92), rgba(11,20,36,0.78)) !important; border-radius: 1.2vh; }
    html[data-vs-bg="transparent"] #fullScreen { background: rgba(5,8,14,0.72) !important; }
    /* positioning of the lower third (and the note card) inside the safe area */
    html[data-vs-pos] #lowerThird { width: calc(var(--vs-width) * 1%); left: calc((100% - var(--vs-width) * 1%) / 2 + var(--vs-x) * 1%); bottom: calc(var(--vs-safe) * 1vh - var(--vs-y) * 1vh); right: auto; }
    html[data-vs] #lowerThird .lt-text, html[data-vs] .fs-text, html[data-vs] .sq-text { font-size-adjust: none; }
    /* Cinematic teaching layout: letterboxed, centred serif scripture, gold reference above */
    html[data-layout="cinematic"] #fullScreen { padding: 14vh 10vw; }
    html[data-layout="cinematic"] #fullScreen::before, html[data-layout="cinematic"] #fullScreen::after {
      content: ''; position: absolute; left: 0; right: 0; height: 9vh; background: #000; z-index: 3; }
    html[data-layout="cinematic"] #fullScreen::before { top: 0; }
    html[data-layout="cinematic"] #fullScreen::after { bottom: 0; }
    html[data-layout="cinematic"] .fs-ref { order: -1; margin-bottom: 3.2vh; padding-bottom: 1.6vh; width: auto; border-bottom: 0.2vh solid var(--vs-accent, #C9A961); color: var(--vs-accent, #C9A961); }
    html[data-layout="cinematic"] .fs-text { width: 78%; line-height: 1.42; }
    /* Split screen: camera window on one side (a vMix layer underneath shows through), scripture on the other */
    html[data-split] .sq-window { top: calc((100vh - var(--sw, 0.46) * 100vh) / 2); width: calc(var(--sw, 0.46) * 100vw); height: calc(var(--sw, 0.46) * 100vh); }
    html[data-split="camera-left"] .sq-window { left: 2.5vw; }
    html[data-split="camera-right"] .sq-window { left: calc(100vw - 2.5vw - var(--sw, 0.46) * 100vw); }
    html[data-split] .sq-panel { top: 9vh; bottom: 9vh; }
    html[data-split="camera-left"] .sq-panel { left: calc(2.5vw + var(--sw, 0.46) * 100vw + 2.5vw); right: 2.5vw; }
    html[data-split="camera-right"] .sq-panel { left: 2.5vw; right: calc(2.5vw + var(--sw, 0.46) * 100vw + 2.5vw); }
    html[data-split] .sq-ref { top: calc((100vh + var(--sw, 0.46) * 100vh) / 2 + 2vh); bottom: auto; height: auto; width: calc(var(--sw, 0.46) * 100vw); justify-content: center; }
    html[data-split="camera-left"] .sq-ref { left: 2.5vw; right: auto; }
    html[data-split="camera-right"] .sq-ref { left: calc(100vw - 2.5vw - var(--sw, 0.46) * 100vw); right: auto; }
    /* profile palette also recolours the theme's accent bars; the idle mark stays hidden behind split / cinematic */
    html[data-vs-bg]:not([data-vs-bg="theme"]) #lowerThird::before, html[data-vs-bg]:not([data-vs-bg="theme"]) .sq-panel::before {
      background: linear-gradient(90deg, var(--vs-accent), rgba(244,239,228,0.7)); box-shadow: 0 0 1.2vh var(--vs-accent); }
    html[data-vs-bg]:not([data-vs-bg="theme"]) #refNote .rn-label { color: var(--vs-accent); }
    html[data-split] #idle .logo, html[data-layout] #idle .logo { visibility: hidden; }
    /* Sermon notes: their own layer near the top, never over the scripture, never clearing it */
    #noteLayer { position: fixed; left: 50%; top: calc(var(--vs-safe, 5) * 1vh); z-index: 14; width: 70vw; margin-left: -35vw; text-align: center;
      opacity: 0; transform: translateY(0); transition: opacity 0.45s ease, transform 0.45s ease; pointer-events: none; }
    #noteLayer.show { opacity: 1; transform: translateY(0); }
    #noteLayer .nl-card { display: inline-block; max-width: 100%; padding: 2.2vh 3.2vw 2.4vh; border-radius: 1.4vh;
      background: linear-gradient(180deg, rgba(18,27,44,0.94), rgba(11,20,36,0.94)); border: 1px solid rgba(201,169,97,0.45);
      box-shadow: 0 2vh 5vh rgba(0,0,0,0.45); }
    #noteLayer .nl-kind { font-size: 1.7vh; font-weight: 700; letter-spacing: 0.32em; text-transform: uppercase; color: var(--vs-accent, #C9A961); margin-bottom: 1vh; }
    #noteLayer .nl-text { font-size: calc(4.4vh * var(--vs-scale, 1)); font-weight: 600; line-height: 1.25; color: var(--vs-text, #F4EFE4); }
    #noteLayer.title .nl-text { font-size: calc(5.6vh * var(--vs-scale, 1)); }
    #noteLayer .nl-refs { margin-top: 1.1vh; font-size: 2vh; letter-spacing: 0.12em; color: var(--vs-muted, #A3ABB9); }
    #noteLayer .nl-refs:empty { display: none; }
    /* ministry brand mark */
    #vsBrand { position: fixed; right: calc(var(--vs-safe, 5) * 1vw); top: calc(var(--vs-safe, 5) * 1vh); z-index: 13; text-align: right; display: none; pointer-events: none; }
    html[data-vs-brand] #vsBrand { display: block; }
    #vsBrand .vb-name { font-size: 2vh; font-weight: 700; letter-spacing: 0.28em; text-transform: uppercase; color: var(--vs-accent, #C9A961); }
    #vsBrand .vb-tag { font-size: 1.5vh; letter-spacing: 0.08em; color: var(--vs-muted, #A3ABB9); margin-top: 0.4vh; }
    #vsBrand .vb-tag:empty { display: none; }
  </style>
</head>
<body>
  <div id="idle"><div class="logo">Di.Verse</div></div>
  <div id="lowerThird">
    <canvas class="bg-canvas"></canvas><div class="bg-dim"></div>
    <div class="lt-ref"><span id="ltRef"></span><span class="badge" id="ltBadge">KJV</span><span class="page-count" id="ltPage"></span></div>
    <div class="lt-text" id="ltText"></div>
  </div>
  <div id="fullScreen">
    <canvas class="bg-canvas"></canvas><div class="bg-dim"></div>
    <div class="fs-text" id="fsText"></div>
    <div class="fs-ref"><span id="fsRef"></span><span class="badge" id="fsBadge">KJV</span><span class="page-count" id="fsPage"></span></div>
  </div>
  <!-- Squeeze-back: the camera (a vMix layer underneath) shows through the
       window; the scripture gets its own large panel -->
  <div id="squeeze">
    <div class="sq-bg" id="sqBg"><canvas class="bg-canvas"></canvas><div class="bg-dim"></div></div>
    <div class="sq-strip t"></div><div class="sq-strip b"></div><div class="sq-strip l"></div><div class="sq-strip r"></div>
    <div class="sq-window" id="sqWindow"></div>
    <div class="sq-panel"><div class="sq-text" id="sqText"></div><div class="sq-page" id="sqPage"></div></div>
    <div class="sq-ref"><span id="sqRef"></span><span class="badge" id="sqBadge">KJV</span></div>
  </div>
  <div id="refNote"><div class="rn-label" id="rnLabel">Scriptural Reference</div><div class="rn-ref" id="rnRef"></div><div class="rn-title" id="rnTitle"></div></div>
  <div id="noteLayer"><div class="nl-card"><div class="nl-kind" id="nlKind"></div><div class="nl-text" id="nlText"></div><div class="nl-refs" id="nlRefs"></div></div></div>
  <div id="vsBrand"><div class="vb-name" id="vbName"></div><div class="vb-tag" id="vbTag"></div></div>
  <div id="reconnect">Reconnecting...</div>
<script src="/projection/backgrounds.js"></script>
<script src="/scripture-text.js"></script>
<script>
  var OVERLAY = /[?&]overlay(=|&|$)/.test(location.search);
  if (OVERLAY) document.documentElement.classList.add('overlay');
  // The WebGL backgrounds run on the projector page only, unless ?webgl=1
  var USE_WEBGL = !OVERLAY || /[?&]webgl=1/.test(location.search);
  var reconnectTimer, sock = null, pending = [], reported = 0;
  function toArray(list) { return Array.prototype.slice.call(list); }

  // Problems in this page (e.g. inside vMix's built-in browser, where nobody
  // can see a console) are sent to Di.Verse: the Terminal and the Operator
  // page show them, with the browser version
  function send(obj) {
    try {
      if (sock && sock.readyState === 1) sock.send(JSON.stringify(obj));
      else if (pending.length < 10) pending.push(obj);
    } catch (e) {}
  }
  function report(message) {
    if (reported++ < 20) send({ action: 'CLIENT_ERROR', message: String(message).slice(0, 300) });
  }
  window.onerror = function(message, src, line) { report(message + (line ? ' (line ' + line + ')' : '')); };
  function hasWebGL() {
    try { var c = document.createElement('canvas'); return !!(c.getContext('webgl') || c.getContext('experimental-webgl')); }
    catch (e) { return false; }
  }
  // ── Backgrounds: 'theme' uses the colour theme; otherwise a still or live
  // background from backgrounds.js ──
  var BG = window.DiVerseBackgrounds;
  var currentBg = 'theme', currentTheme = null, renderers = {};

  // Squeeze camera window: a share of the screen (0.20–0.46). Up to a third
  // uses the stacked layout (scripture full width underneath)
  var camShare = 0.46;
  function camLayout() { return camShare <= 0.34 ? 'stack' : 'side'; }
  function applyCamera(percent) {
    var v = Math.min(0.5, Math.max(0.15, (parseFloat(percent) || 25) / 100));
    camShare = v;
    document.documentElement.style.setProperty('--cam', String(v));
    document.documentElement.setAttribute('data-sq', camLayout());
  }
  applyCamera(20);

  function applyBackground(id, frame, size, camera) {
    currentBg = id || 'theme';
    document.documentElement.setAttribute('data-frame', frame || 'bar');
    if (size) textSize = SIZES[size] ? size : 'large';
    if (camera) applyCamera(camera);
    paintBackgrounds();
    applyFontSize();
  }

  // Elements that carry each box's background. In vMix (overlay page) the
  // squeeze background is the four strips round the camera window.
  function bgTargets(boxId) {
    if (boxId !== 'squeeze') return [document.getElementById(boxId)];
    if (OVERLAY) return toArray(document.querySelectorAll('.sq-strip'));
    return [document.getElementById('sqBg')];
  }
  function setBg(boxId, css, drift) {
    bgTargets(boxId).forEach(function(el) {
      el.style.background = css;
      if (OVERLAY && boxId === 'squeeze') el.style.backgroundAttachment = 'fixed';
      if (drift) el.classList.add('bg-drift'); else el.classList.remove('bg-drift');
      if (!drift && OVERLAY && boxId === 'squeeze') el.style.backgroundSize = '100vw 100vh';
    });
  }

  function paintBackgrounds() {
    var found = BG && BG.find(currentBg);
    if (!OVERLAY) updateSqueezeClip(); // keep the camera window open whatever the background
    document.documentElement.removeAttribute('data-light');
    // [box that is shown, element that carries the background]
    [['lowerThird', 'lowerThird'], ['fullScreen', 'fullScreen'], ['squeeze', 'sqBg']].forEach(function(pair) {
      try {
        var boxId = pair[0], box = document.getElementById(pair[1]), shownBox = document.getElementById(boxId);
        var canvas = box.querySelector('.bg-canvas'), dim = box.querySelector('.bg-dim');
        if (renderers[boxId]) renderers[boxId].stop();
        canvas.style.display = 'none'; dim.style.display = 'none';
        var covers = boxId !== 'lowerThird'; // full screen and squeeze hide the picture behind them
        if (!found) {
          if (currentTheme) setBg(boxId, covers ? currentTheme.bg.replace(/[\d.]+\)$/, '1)') : currentTheme.bg, false);
          return;
        }
        if (found.kind === 'still') {
          // See-through tints would let the camera show behind full-screen text: give them a solid base there
          setBg(boxId, covers && (found.bg.glass || found.bg.clear) ? found.bg.css.replace(/^transparent$/, 'rgba(0,0,0,0)') + ', #070a14' : found.bg.css, false);
          if (found.bg.light && boxId === 'lowerThird') document.documentElement.setAttribute('data-light', '1');
          return;
        }
        if (!USE_WEBGL) { setBg(boxId, BG.driftCss(found.bg, boxId === 'lowerThird'), true); return; }
        setBg(boxId, BG.fallbackCss(found.bg), false); // shown if WebGL isn't available
        if (!shownBox.classList.contains('show')) return; // only animate what's on screen
        var r = renderers[boxId] || (renderers[boxId] = new BG.Renderer(canvas, boxId === 'lowerThird' ? 0.5 : 0.35));
        if (r.start(found.bg)) { canvas.style.display = 'block'; dim.style.display = 'block'; }
      } catch (err) { report('background ' + pair[0] + ': ' + err.message); }
    });
  }

  function applyTheme(theme) {
    if (!theme) return;
    currentTheme = theme;
    paintBackgrounds();
    document.getElementById('lowerThird').style.borderTopColor = theme.border;
    document.getElementById('ltRef').style.color = theme.ref;
    document.getElementById('ltText').style.color = theme.text;
    document.getElementById('fsText').style.color = theme.text;
    document.getElementById('fsRef').style.color = theme.ref;
    document.getElementById('sqRef').style.color = theme.ref;
    toArray(document.querySelectorAll('.badge')).forEach(function(b) { b.style.background = theme.accent; });
    document.documentElement.style.setProperty('--accent', theme.accent);
  }

  // ── Readable from the back of a big room ──
  // Text is sized as a share of the screen height (vh), so it's equally big
  // on a TV, a projector or a 1080p stream. Long verses are never shrunk:
  // they're split into pages that fit (2 lines in the lower third at Large),
  // shown in turn at reading pace with a "1/3" counter — the preacher's face
  // stays visible above the caption.
  var SIZES = {
    // sq: side-by-side squeeze; sqs: small camera with full-width scripture
    normal: { lt: 3.8, ref: 2.4, fs: 5.2, sq: 5.0, sqs: 6.0, ltLines: 3 },
    large:  { lt: 4.8, ref: 2.8, fs: 6.2, sq: 6.0, sqs: 7.2, ltLines: 2 },
    xl:     { lt: 5.9, ref: 3.2, fs: 7.4, sq: 7.0, sqs: 8.4, ltLines: 2 },
  };
  var textSize = 'large';
  var fontDelta = 0; // operator's +/- buttons, kept for every new verse

  function applySizes() {
    var sz = SIZES[textSize] || SIZES.large, k = Math.max(0.6, 1 + fontDelta / 24);
    document.getElementById('ltText').style.fontSize = (sz.lt * k) + 'vh';
    document.getElementById('fsText').style.fontSize = (sz.fs * k) + 'vh';
    document.getElementById('sqText').style.fontSize = ((camLayout() === 'stack' ? sz.sqs : sz.sq) * k) + 'vh';
    document.querySelector('.lt-ref').style.fontSize = (sz.ref * k) + 'vh';
    document.querySelector('.fs-ref').style.fontSize = (sz.ref * 1.5 * k) + 'vh';
    document.querySelector('.sq-ref').style.fontSize = (sz.ref * (camLayout() === 'stack' ? 2 : 1.6) * k) + 'vh';
  }

  function applyFontSize(delta) {
    if (delta !== undefined) fontDelta = delta;
    applySizes();
    if (fitted.text != null) fit(fitted.box, fitted.text); // refit at the new size
  }

  var fitted = { box: null, text: null };

  var BOXES = {
    lowerThird: { text: 'ltText', counter: 'ltPage', ref: 'ltRef', badge: 'ltBadge' },
    fullScreen: { text: 'fsText', counter: 'fsPage', ref: 'fsRef', badge: 'fsBadge' },
    squeeze:    { text: 'sqText', counter: 'sqPage', ref: 'sqRef', badge: 'sqBadge' },
  };

  // Height (px) the scripture may take in Squeeze / Full screen: the real
  // panel, measured, so it follows the camera size and the screen
  function textRoom(box) {
    var H = window.innerHeight;
    if (box === 'squeeze') {
      var panel = document.querySelector('.sq-panel'), cs = getComputedStyle(panel);
      return panel.clientHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom) - H * 0.02;
    }
    var fs = document.getElementById('fullScreen'), fcs = getComputedStyle(fs);
    var ref = document.querySelector('.fs-ref');
    return fs.clientHeight - parseFloat(fcs.paddingTop) - parseFloat(fcs.paddingBottom) - ref.offsetHeight - H * 0.03 - H * 0.04;
  }

  // The squeeze background has a hole where the camera window is (projector
  // page; in vMix the four strips do this instead)
  function updateSqueezeClip() {
    var w = document.getElementById('sqWindow').getBoundingClientRect();
    var x1 = Math.round(w.left) + 'px', y1 = Math.round(w.top) + 'px', x2 = Math.round(w.right) + 'px', y2 = Math.round(w.bottom) + 'px';
    // Outer rectangle clockwise, then in along the top edge of the window and
    // round it the other way: the window is left uncovered (polygon "keyhole")
    var poly = 'polygon(0 0, 100% 0, 100% 100%, 0 100%, 0 ' + y1 + ', ' +
      x1 + ' ' + y1 + ', ' + x1 + ' ' + y2 + ', ' + x2 + ' ' + y2 + ', ' + x2 + ' ' + y1 + ', 0 ' + y1 + ')';
    var bg = document.getElementById('sqBg');
    bg.style.webkitClipPath = poly;
    bg.style.clipPath = poly;
  }

  // Largest size between lo and hi (px) for which ok(size) holds (lo if none)
  function largest(el, lo, hi, ok) {
    el.style.fontSize = hi + 'px';
    if (ok()) return hi;
    for (var i = 0; i < 14 && hi - lo > 0.5; i++) {
      var mid = (lo + hi) / 2;
      el.style.fontSize = mid + 'px';
      if (ok()) lo = mid; else hi = mid;
    }
    el.style.fontSize = lo + 'px';
    return lo;
  }

  // The whole verse is always on screen at once — never "1/3" pages, however
  // long it is (Esther 8:9 is 90 words). Each mode picks the size that fills
  // its space:
  //  · Full screen / Squeeze: the largest size at which the verse fits the
  //    panel (short verses grow big, long ones come down as far as needed).
  //  · Lower third: the chosen size while the verse fits in a few lines; a
  //    longer verse first gets one more line and slightly smaller type, and a
  //    very long one lets the bar grow upward (to about a third of the screen)
  //    with the type as small as it takes.
  function fit(box, text) {
    var el = document.getElementById(BOXES[box].text), H = window.innerHeight;
    fitted.box = box; fitted.text = text;
    el.textContent = text;
    document.getElementById(BOXES[box].counter).textContent = '';
    applySizes();
    var chosen = parseFloat(getComputedStyle(el).fontSize) || H * 0.05;
    var minPx = Math.max(10, H * 0.022);
    var wide = function() { return el.scrollWidth <= el.clientWidth + 1; }; // no word cut off
    if (box === 'lowerThird') {
      var sz = SIZES[textSize] || SIZES.large, lines = sz.ltLines + 1;
      var inLines = function() { var f = parseFloat(el.style.fontSize); return el.scrollHeight <= lines * f * 1.32 + 3 && wide(); };
      var size = largest(el, chosen * 0.72, chosen, inLines);
      if (!inLines()) largest(el, minPx, chosen * 0.72, function() { return el.scrollHeight <= H * 0.34 && wide(); });
      return;
    }
    var room = textRoom(box);
    var maxPx = H * (box === 'squeeze' ? (camLayout() === 'stack' ? 0.14 : 0.11) : 0.14);
    largest(el, minPx, Math.max(minPx, maxPx), function() { return el.scrollHeight <= room && wide(); });
  }

  window.addEventListener('resize', function() { if (!OVERLAY) updateSqueezeClip(); applyFontSize(); });
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(function() { applyFontSize(); }); // refit once the font has loaded

  // Display modes. split-left / split-right (scripture on that side, camera
  // window on the other) reuse the squeeze box; cinematic reuses full screen.
  // Split geometry must match services/vmix.js (splitGeometry).
  function boxFor(mode) {
    return mode === 'full-screen' || mode === 'cinematic' ? 'fullScreen'
      : mode === 'squeeze' || mode === 'split-left' || mode === 'split-right' ? 'squeeze' : 'lowerThird';
  }
  function setLayout(mode) {
    var root = document.documentElement;
    if (mode === 'cinematic') root.setAttribute('data-layout', 'cinematic'); else root.removeAttribute('data-layout');
    if (mode === 'split-right') root.setAttribute('data-split', 'camera-left');
    else if (mode === 'split-left') root.setAttribute('data-split', 'camera-right');
    else root.removeAttribute('data-split');
  }

  function showVerse(verse, theme, fontSize) {
    hide();
    try { applyTheme(theme); } catch (err) { report('theme: ' + err.message); }
    if (fontSize !== undefined) fontDelta = fontSize;
    setLayout(verse.displayMode);
    var box = boxFor(verse.displayMode);
    show(box, verse.reference, verse.translation, verse.text, true);
  }

  // The words go up first, so whatever else fails the verse is on screen;
  // the background and the sizing follow, each on its own
  function show(box, ref, badge, text, formatScripture) {
    var visibleText = formatScripture ? DiVerseScriptureText.display(text) : text;
    document.getElementById(BOXES[box].ref).textContent = ref;
    document.getElementById(BOXES[box].badge).textContent = badge;
    document.getElementById(BOXES[box].text).textContent = visibleText;
    document.getElementById(box).classList.add('show');
    try { paintBackgrounds(); } catch (err) { report('background: ' + err.message); } // start the live effect now the box is visible
    try { fit(box, visibleText); }
    catch (err) {
      report('layout: ' + err.message);
      var el = document.getElementById(BOXES[box].text);
      el.textContent = visibleText;
      if (!parseFloat(getComputedStyle(el).fontSize)) el.style.fontSize = '5vh';
    }
  }

  function showLyrics(lyrics, theme, fontSize) {
    hide();
    try { applyTheme(theme); } catch (err) { report('theme: ' + err.message); }
    if (fontSize !== undefined) fontDelta = fontSize;
    setLayout(lyrics.displayMode);
    var box = boxFor(lyrics.displayMode);
    show(box, lyrics.songTitle + (lyrics.section ? '  ·  ' + lyrics.section : ''), '', lyrics.content); // no "1/6" slide counter
  }

  function hide() {
    fitted.text = null;
    document.getElementById('lowerThird').classList.remove('show');
    document.getElementById('fullScreen').classList.remove('show');
    document.getElementById('squeeze').classList.remove('show');
    document.getElementById('refNote').classList.remove('show');
    for (var k in renderers) renderers[k].stop(); // nothing on screen: no GPU work
  }

  // Reference only, for note-takers: the passage itself isn't shown
  function showReference(msg) {
    hide();
    try { applyTheme(msg.theme); } catch (err) { report('theme: ' + err.message); }
    document.getElementById('rnLabel').textContent = msg.label || 'Scriptural Reference';
    document.getElementById('rnRef').textContent = msg.reference || '';
    document.getElementById('rnTitle').textContent = msg.title || '';
    document.getElementById('refNote').classList.add('show');
  }


  // ── Virtual set profile (v1.12) ──
  var PREVIEW = /[?&]preview(=|&|$)/.test(location.search);
  function applyProfile(profile) {
    var root = document.documentElement, st = profile && profile.settings;
    if (!st) return;
    var p = st.palette || {}, pos = st.position || {}, m = st.ministry || {}, tr = st.transition || {};
    var vars = { '--vs-base': p.base, '--vs-panel': p.panel, '--vs-accent': p.accent, '--vs-text': p.text, '--vs-muted': p.muted,
      '--vs-scale': st.textScale, '--vs-x': pos.x, '--vs-y': pos.y, '--vs-width': pos.width, '--vs-safe': st.safeArea,
      '--vs-ms': (tr.type === 'none' ? 0 : tr.ms) / 1000 + 's', '--sw': Math.max(0.3, (st.splitRatio || 50) / 100 - 0.04) };
    for (var k in vars) if (vars[k] !== undefined && vars[k] !== null) root.style.setProperty(k, String(vars[k]));
    root.setAttribute('data-vs', profile.name || 'profile');
    root.setAttribute('data-vs-bg', st.background || 'theme');
    root.setAttribute('data-vs-type', st.typeface || 'sans');
    root.setAttribute('data-vs-trans', tr.type || 'fade');
    if (pos.width < 100 || pos.x || pos.y) root.setAttribute('data-vs-pos', '1'); else root.removeAttribute('data-vs-pos');
    document.getElementById('vbName').textContent = m.name || '';
    document.getElementById('vbTag').textContent = m.tagline || '';
    if (m.showBrand && m.name) root.setAttribute('data-vs-brand', '1'); else root.removeAttribute('data-vs-brand');
    try { applyFontSize(); } catch (e) {}
  }

  // ── Sermon notes: a layer of their own (never clears scripture or lyrics) ──
  var noteTimer = null;
  var KIND_LABEL = { title: 'Sermon Title', highlight: 'Key Thought' };
  function showNote(msg) {
    var n = msg.note || {}, el = document.getElementById('noteLayer');
    document.getElementById('nlKind').textContent = n.kind === 'point' ? (n.number ? 'Point ' + n.number : 'Point') : (KIND_LABEL[n.kind] || '');
    document.getElementById('nlText').textContent = DiVerseScriptureText.display(n.text || '');
    document.getElementById('nlRefs').textContent = (n.refs || []).join('  ·  ');
    el.className = n.kind === 'title' ? 'title show' : 'show';
    clearTimeout(noteTimer);
    if (msg.durationMs > 0) noteTimer = setTimeout(hideNote, msg.durationMs);
  }
  function hideNote() {
    clearTimeout(noteTimer);
    var el = document.getElementById('noteLayer');
    el.className = el.className.replace(/\bshow\b/, '').replace(/\s+$/, '');
  }

  // Preview (Operator -> Virtual Set): shows the live screen with a draft profile
  // sent by the Operator page, and sample content when nothing is up
  if (PREVIEW) {
    window.addEventListener('message', function(e) {
      if (e.origin !== location.origin || !e.data) return;
      if (e.data.type === 'diverse:preview-profile') applyProfile(e.data.profile);
      if (e.data.type === 'diverse:preview-sample') {
        var mode = e.data.mode || 'lower-third';
        showVerse({ reference: 'John 3:16', translation: 'KJV', text: 'For God so loved the world, that he gave his only begotten Son, that whosoever believeth in him should not perish, but have everlasting life.', displayMode: mode });
        if (e.data.note) showNote({ note: { kind: 'point', number: 1, text: 'God has a plan for your life', refs: ['Jeremiah 29:11'] }, durationMs: 0 });
        else hideNote();
      }
    });
  }

  // A screen left open (vMix, the projector) loads the new page by itself
  // when Di.Verse is updated, so nobody has to refresh vMix's input
  var pageVersion = null;
  function checkVersion() {
    try {
      var x = new XMLHttpRequest();
      x.open('GET', '/api/version?t=' + Date.now());
      x.onload = function() {
        try {
          var v = JSON.parse(x.responseText).version;
          if (!pageVersion) pageVersion = v;
          else if (v && v !== pageVersion) {
            // load the new page at a fresh address, so no old copy can answer
            var q = location.search.replace(/([?&])v=[^&]*&?/, '$1').replace(/[?&]$/, '');
            location.replace(location.pathname + q + (q ? '&' : '?') + 'v=' + encodeURIComponent(v));
          }
        } catch (e) {}
      };
      x.send();
    } catch (e) {}
  }

  function connect() {
    var ws = new WebSocket((location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host + '?type=' + (PREVIEW ? 'preview' : 'projection') + (OVERLAY ? '&overlay=1' : ''));
    sock = ws;
    ws.onopen = function() {
      clearTimeout(reconnectTimer);
      document.getElementById('reconnect').style.display = 'none';
      send({ action: 'CLIENT_INFO', ua: navigator.userAgent, width: window.innerWidth, height: window.innerHeight, overlay: OVERLAY, webgl: hasWebGL() });
      while (pending.length) send(pending.shift());
      checkVersion();
    };
    ws.onmessage = function(e) {
      try {
        var msg = JSON.parse(e.data);
        if (msg.action === 'SHOW_VERSE')   showVerse(msg.verse, msg.theme, msg.fontSize);
        else if (msg.action === 'SHOW_REFERENCE') showReference(msg);
        else if (msg.action === 'SHOW_LYRICS') showLyrics(msg.lyrics, msg.theme, msg.fontSize);
        else if (msg.action === 'APPLY_BACKGROUND') applyBackground(msg.background, msg.frame, msg.size, msg.camera);
        else if (msg.action === 'CLEAR')   { hide(); hideNote(); }
        else if (msg.action === 'APPLY_THEME') applyTheme(msg.theme);
        else if (msg.action === 'FONT_SIZE')   applyFontSize(msg.delta);
        else if (msg.action === 'SHOW_NOTE')   showNote(msg);
        else if (msg.action === 'HIDE_NOTE')   hideNote();
        else if (msg.action === 'APPLY_PROFILE' && !PREVIEW) applyProfile(msg.profile);
      } catch (err) { report((msg && msg.action || 'message') + ': ' + err.message); }
    };
    ws.onclose = function() {
      document.getElementById('reconnect').style.display = 'block';
      reconnectTimer = setTimeout(connect, 2000);
    };
    ws.onerror = function() { ws.close(); };
  }
  connect();
</script>
</body>
</html>
