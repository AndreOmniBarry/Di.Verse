<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
  <title>Di.Verse</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #0A0A1E;
      color: white;
      font-family: Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 28px;
      text-align: center;
    }

    .wordmark {
      position: fixed;
      top: 20px;
      left: 0;
      right: 0;
      text-align: center;
      font-size: 0.7rem;
      letter-spacing: 4px;
      color: rgba(255,255,255,0.12);
      text-transform: uppercase;
    }
    .wordmark span { color: #E94560; }

    #content {
      width: 100%;
      max-width: 560px;
    }

    .standby {
      font-size: 0.9rem;
      letter-spacing: 3px;
      color: rgba(255,255,255,0.18);
      text-transform: uppercase;
    }

    .verse-ref {
      font-size: 1rem;
      font-weight: bold;
      color: #E94560;
      letter-spacing: 1px;
      margin-bottom: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    .badge {
      background: #E94560;
      color: white;
      font-size: 0.6rem;
      font-weight: bold;
      padding: 2px 8px;
      border-radius: 20px;
      letter-spacing: 1px;
    }

    .verse-text {
      font-size: 1.65rem;
      line-height: 1.75;
      color: #FFFFFF;
      margin-top: 14px;
    }

    .verse-text.md { font-size: 1.35rem; }
    .verse-text.sm { font-size: 1.1rem; }

    /* Status dot bottom */
    #statusBar {
      position: fixed;
      bottom: 16px;
      left: 0;
      right: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #2ECC71;
    }
    .dot.warn { background: #E94560; }

    #statusText {
      font-size: 0.62rem;
      color: rgba(255,255,255,0.2);
      letter-spacing: 1px;
    }
  </style>
</head>
<body>

  <div class="wordmark">Di<span>.</span>Verse</div>

  <div id="content">
    <div class="standby">Standing by...</div>
  </div>

  <div id="statusBar">
    <div class="dot" id="dot"></div>
    <span id="statusText">Connected</span>
  </div>

<script>
  let reconnectTimer;

  function sizeClass(text) {
    if (text.length > 220) return 'sm';
    if (text.length > 130) return 'md';
    return '';
  }

  function setStatus(connected) {
    document.getElementById('dot').className = connected ? 'dot' : 'dot warn';
    document.getElementById('statusText').textContent = connected ? 'Connected' : 'Reconnecting...';
  }

  function handleMessage(msg) {
    const content = document.getElementById('content');

    if (msg.action === 'SHOW_VERSE' && msg.verse) {
      const v = msg.verse;
      const sc = sizeClass(v.text);
      content.innerHTML = `
        <div class="verse-ref">
          ${v.reference}
          <span class="badge">${v.translation}</span>
        </div>
        <div class="verse-text ${sc}">${v.text}</div>
      `;
    } else if (msg.action === 'CLEAR') {
      content.innerHTML = '<div class="standby">Standing by...</div>';
    }
  }

  function connect() {
    const ws = new WebSocket(`ws://${location.host}?type=preacher`);

    ws.onopen = () => {
      clearTimeout(reconnectTimer);
      setStatus(true);
    };

    ws.onmessage = (e) => {
      const msg = JSON.parse(e.data);
      handleMessage(msg);
    };

    ws.onclose = () => {
      setStatus(false);
      reconnectTimer = setTimeout(connect, 2000);
    };

    ws.onerror = () => ws.close();
  }

  connect();
</script>
</body>
</html>
