name: Refresh Di.Verse release dependencies

on:
  push:
    branches:
      - release/v1.11.0
    paths:
      - package.json
      - package-lock.json
      - .github/workflows/dependency-refresh.yml

permissions:
  contents: write

jobs:
  refresh:
    name: Apply compatible npm security fixes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out release branch
        uses: actions/checkout@v4
      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Refresh vulnerable transitive dependencies
        run: npm audit fix --package-lock-only
      - name: Require no high or critical advisories
        run: npm audit --omit=optional --audit-level=high
      - name: Commit updated dependency lock
        run: |
          if git diff --quiet -- package.json package-lock.json; then
            echo "Dependency lock already current; no commit needed."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package.json package-lock.json
            git commit -m "fix(deps): resolve npm security advisories"
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi
