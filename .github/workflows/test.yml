name: Di.Verse tests

on:
  push:
    branches:
      - main
      - feature/sermon-audio-quality-20261124
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install SQLite command-line tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes sqlite3
      - name: Install dependencies
        run: npm ci --omit=optional
      - name: Run isolated test suite
        run: npm test
